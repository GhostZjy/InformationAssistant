<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安检点工时与工资计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            margin: 0;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.12), 0 10px 20px rgba(0, 0, 0, 0.06);
            padding: 2.5rem 2rem;
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #1a2b4c;
            text-align: center;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        h1 span {
            background: #2563eb;
            color: white;
            font-size: 1.4rem;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            margin-left: 0.2rem;
        }

        .subtitle {
            text-align: center;
            color: #5a6e8c;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            border-bottom: 1px solid #dce3ec;
            padding-bottom: 1.2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }

        input,
        select {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.9rem;
            background: white;
            font-size: 1rem;
            transition: 0.2s;
            outline: none;
            color: #0f172a;
        }
        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .inline-row {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .inline-row .input-group {
            flex: 1;
        }

        .toggle-area {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 1rem 1.2rem;
            margin: 1rem 0 1.8rem;
            border: 1px solid #e2e8f0;
        }

        .low-hours-input {
            margin-top: 1rem;
            display: none;
        }
        .low-hours-input.active {
            display: block;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 1.2rem;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.8rem;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        button:hover {
            background: #1d4ed8;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0px);
        }

        .result-card {
            margin-top: 2.2rem;
            background: #f0f9ff;
            border-radius: 1.2rem;
            padding: 1.6rem 1.5rem;
            border: 1px solid #b9d9f5;
            display: none;
        }
        .result-card.active {
            display: block;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.7rem 0;
            border-bottom: 1px dashed #bed9f0;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-label {
            font-weight: 600;
            color: #1e3a5f;
            font-size: 1rem;
        }
        .result-value {
            font-weight: 700;
            font-size: 1.4rem;
            color: #0f172a;
        }
        .result-value small {
            font-size: 0.85rem;
            font-weight: 500;
            color: #475569;
        }

        .error-msg {
            color: #b91c1c;
            background: #fee2e2;
            padding: 0.8rem 1rem;
            border-radius: 0.8rem;
            margin-top: 1rem;
            font-weight: 500;
            display: none;
        }
        .error-msg.active {
            display: block;
        }

        .info-note {
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #475569;
            text-align: center;
            background: #f1f5f9;
            padding: 0.5rem 0.8rem;
            border-radius: 0.8rem;
        }

        @media (max-width: 500px) {
            .container {
                padding: 1.8rem 1.2rem;
            }
            .inline-row {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            安检点工资计算器
            <span>🔍</span>
        </h1>
        <div class="subtitle">基于工时阶梯单价 · 自动汇总</div>

        <div class="input-group">
            <label>🔢 安检点数量</label>
            <input type="number" id="areas" placeholder="例如 2" value="2" min="1" step="1">
        </div>

        <div class="inline-row">
            <div class="input-group">
                <label>📅 当月天数</label>
                <input type="number" id="days" placeholder="默认30" value="30" min="1" max="31" step="1">
            </div>
            <div class="input-group">
                <label>👥 总员工人数</label>
                <input type="number" id="totalPeople" placeholder="例如 13" value="13" min="1" step="1">
            </div>
        </div>

        <div class="toggle-area">
            <label style="margin-bottom:0.3rem;">⚠️ 是否存在月工时低于174小时的人？</label>
            <select id="hasLowHours" style="width:100%;">
                <option value="no">否 — 所有人 ≥ 174小时</option>
                <option value="yes">是 — 有人的工时不足174小时</option>
            </select>

            <div id="lowHoursContainer" class="low-hours-input">
                <label>📝 请输入这些人的具体工时（用逗号分隔）</label>
                <input type="text" id="lowHoursInput" placeholder="例如：150, 160, 170">
                <div class="info-note" style="margin-top:0.5rem;">
                    剩余人员将平均分配剩余工时，且必须 ≥ 174小时。
                </div>
            </div>
        </div>

        <button id="calculateBtn">📊 计算总工资与工时</button>

        <div id="errorBox" class="error-msg"></div>

        <div id="resultCard" class="result-card">
            <div class="result-item">
                <span class="result-label">📆 总需求工时</span>
                <span class="result-value" id="totalHours">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">💵 总工资（含B班补贴）</span>
                <span class="result-value" id="totalSalary">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">📊 平均工资</span>
                <span class="result-value" id="avgSalary">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">⏱️ 平均工时</span>
                <span class="result-value" id="avgHours">0</span>
            </div>
            <div class="info-note" style="margin-top:1rem;">
                * 每个安检点每日固定51工时，2个B班（补贴20元/次）。
            </div>
        </div>
    </div>

    <script>
        (function() {
            const BASE_HOURS = 174;
            const BASE_SALARY = 3200;
            const RATE_BASE = BASE_SALARY / BASE_HOURS; // ≈18.3908
            const RATE_OVER = 21.55;
            const RATE_DIFF = RATE_OVER - RATE_BASE;   // ≈3.1592
            const DAILY_HOURS_PER_AREA = 51;           // 1C+2A+2B
            const B_PER_AREA_PER_DAY = 2;
            const B_ALLOWANCE = 20;

            const areasInput = document.getElementById('areas');
            const daysInput = document.getElementById('days');
            const totalPeopleInput = document.getElementById('totalPeople');
            const hasLowHoursSelect = document.getElementById('hasLowHours');
            const lowHoursContainer = document.getElementById('lowHoursContainer');
            const lowHoursInput = document.getElementById('lowHoursInput');
            const calculateBtn = document.getElementById('calculateBtn');
            const errorBox = document.getElementById('errorBox');
            const resultCard = document.getElementById('resultCard');

            // 控制低工时输入框显示
            hasLowHoursSelect.addEventListener('change', function() {
                if (this.value === 'yes') {
                    lowHoursContainer.classList.add('active');
                } else {
                    lowHoursContainer.classList.remove('active');
                    lowHoursInput.value = '';
                }
                // 清除错误和结果
                errorBox.classList.remove('active');
                errorBox.textContent = '';
                resultCard.classList.remove('active');
            });

            function hideError() {
                errorBox.classList.remove('active');
                errorBox.textContent = '';
            }

            function showError(msg) {
                errorBox.textContent = '❌ ' + msg;
                errorBox.classList.add('active');
                resultCard.classList.remove('active');
            }

            function formatNumber(num) {
                return num.toFixed(2);
            }

            function calculate() {
                hideError();
                resultCard.classList.remove('active');

                // 获取输入
                const areas = parseInt(areasInput.value, 10);
                const days = parseInt(daysInput.value, 10);
                const N = parseInt(totalPeopleInput.value, 10);
                const hasLow = hasLowHoursSelect.value === 'yes';

                // 基本校验
                if (isNaN(areas) || areas < 1) {
                    showError('安检点数量必须是大于0的整数');
                    return;
                }
                if (isNaN(days) || days < 1 || days > 31) {
                    showError('当月天数需在1-31之间');
                    return;
                }
                if (isNaN(N) || N < 1) {
                    showError('总员工人数必须是大于0的整数');
                    return;
                }

                // 总需求工时 T
                const T = areas * DAILY_HOURS_PER_AREA * days;
                // B班补贴总额
                const totalBCount = areas * B_PER_AREA_PER_DAY * days;
                const totalBAllowance = totalBCount * B_ALLOWANCE;

                // 处理低工时人员
                let lowHoursList = [];
                if (hasLow) {
                    const raw = lowHoursInput.value.trim();
                    if (raw === '') {
                        showError('请输入低于174小时的人员工时，用逗号分隔');
                        return;
                    }
                    const parts = raw.split(',').map(s => s.trim()).filter(s => s !== '');
                    for (let p of parts) {
                        const val = parseFloat(p);
                        if (isNaN(val) || val < 0) {
                            showError('工时应为非负数字，例如：150, 160');
                            return;
                        }
                        if (val >= BASE_HOURS) {
                            showError(`工时 ${val} 不低于174小时，请将其归入“否”选项，或输入小于174的数值。`);
                            return;
                        }
                        lowHoursList.push(val);
                    }
                }

                if (lowHoursList.length > N) {
                    showError(`低工时人数 (${lowHoursList.length}) 不能超过总人数 (${N})`);
                    return;
                }

                const lowSum = lowHoursList.reduce((a, b) => a + b, 0);
                const remainingPeople = N - lowHoursList.length;

                let allHours = [];
                let E = 0; // 总超额工时

                // 情况1：没有剩余人员（所有人都在低工时列表中）
                if (remainingPeople === 0) {
                    // 总工时必须等于 lowSum
                    if (Math.abs(T - lowSum) > 0.001) {
                        showError(`低工时人员的总工时 (${formatNumber(lowSum)}) 与需求总工时 (${formatNumber(T)}) 不一致，无法分配。`);
                        return;
                    }
                    allHours = [...lowHoursList];
                    // 所有人都低于174，所以E=0（max(0, h-174) 全为0）
                    E = 0;
                } else {
                    // 有剩余人员，他们平分剩余工时
                    const remainingHours = T - lowSum;
                    if (remainingHours <= 0) {
                        showError(`剩余工时 (${formatNumber(remainingHours)}) 必须大于0，请检查低工时人员工时总和是否已超过总需求。`);
                        return;
                    }
                    const avgRemaining = remainingHours / remainingPeople;
                    if (avgRemaining < BASE_HOURS) {
                        showError(`剩余 ${remainingPeople} 人平分后人均工时仅为 ${formatNumber(avgRemaining)} 小时，低于174小时，不符合设定。请调整低工时人数或工时。`);
                        return;
                    }
                    // 构建所有人工时列表
                    allHours = [...lowHoursList];
                    for (let i = 0; i < remainingPeople; i++) {
                        allHours.push(avgRemaining);
                    }
                }

                // 计算超额工时总和 E
                E = allHours.reduce((sum, h) => sum + Math.max(0, h - BASE_HOURS), 0);

                // 计算总工资（不含补贴）
                const basePart = T * RATE_BASE;
                const overPart = E * RATE_DIFF;
                const totalSalaryWithoutAllowance = basePart + overPart;
                const totalSalary = totalSalaryWithoutAllowance + totalBAllowance;

                // 平均工资与平均工时
                const avgSalary = totalSalary / N;
                const avgHours = T / N;

                // 显示结果
                document.getElementById('totalHours').textContent = formatNumber(T) + ' 小时';
                document.getElementById('totalSalary').textContent = '¥ ' + formatNumber(totalSalary);
                document.getElementById('avgSalary').textContent = '¥ ' + formatNumber(avgSalary);
                document.getElementById('avgHours').textContent = formatNumber(avgHours) + ' 小时';

                resultCard.classList.add('active');
            }

            calculateBtn.addEventListener('click', calculate);

            // 可选：按回车键触发计算（在输入框内）
            const inputs = [areasInput, daysInput, totalPeopleInput, lowHoursInput];
            inputs.forEach(inp => {
                inp.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        calculate();
                    }
                });
            });

            // 初始化低工时输入框可见性
            if (hasLowHoursSelect.value === 'yes') {
                lowHoursContainer.classList.add('active');
            } else {
                lowHoursContainer.classList.remove('active');
            }
        })();
    </script>
</body>
</html>
